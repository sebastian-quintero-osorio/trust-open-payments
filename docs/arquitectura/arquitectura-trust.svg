<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de Trust — vista simplificada</title>
<desc id="desc">Frontend web conectado al backend FastAPI por REST. El backend usa PostgreSQL y la API interna del servicio Go op-service. El servicio Go usa su propia persistencia PostgreSQL y se conecta por HTTPS a wallets Open Payments. El navegador permite autorizar en la wallet. El webhook de vuelta al backend corresponde al simulador QR de Puntored/Bre-B. Se representa el modo OP_CLIENT=http, sin afirmar un despliegue o validación bancaria real.</desc>
