services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: trust
      POSTGRES_DB: trust_dev
    ports:
      - "5433:5432"
    volumes:
      - trust_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust -d trust_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  trust_pg: {}
