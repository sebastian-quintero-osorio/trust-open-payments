services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trust
      # `trust` sirve en local; en un servidor define POSTGRES_PASSWORD (y la misma clave en TRUST_API_DATABASE_URL).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trust}
      POSTGRES_DB: trust_dev
    ports:
      # Solo en el loopback del host: la publicación de Docker se salta firewalls como ufw, y así la base nunca queda
      # expuesta aunque el security group abra 5433. La API de compose entra por la red interna (db:5432).
      - "127.0.0.1:5433:5432"
    volumes:
      - trust_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust -d trust_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  # API Trust (Dockerfile de esta carpeta). Configuración desde .env (copia de .env.example); si no existe, la API no
  # arranca porque JWT_SECRET es obligatorio. `docker compose up -d db` sigue funcionando sin .env.
  api:
    build: .
    image: trust-api:local
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro de la red de compose Postgres es db:5432 (el DATABASE_URL de .env apunta a localhost:5433 para correr
      # la API fuera de Docker). Para otra base (RDS, etc.) define TRUST_API_DATABASE_URL en el shell o en .env.
      DATABASE_URL: ${TRUST_API_DATABASE_URL:-postgresql+psycopg://trust:${POSTGRES_PASSWORD:-trust}@db:5432/trust_dev}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TRUST_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway" # op-service (o su mock) corriendo en el host
    restart: unless-stopped

  # HTTPS con Caddy delante de la API (EC2). Descomenta este servicio y el volumen caddy_data, apunta el DNS del
  # dominio a la IP pública y abre 80/443 en el security group. Con Caddy, quita `ports` de api (o publícalo solo en
  # 127.0.0.1) para que nadie salte el proxy, pon PUBLIC_API_URL=https://<dominio> en .env y
  # TRUSTED_PROXIES=172.16.0.0/12 (la red de compose) para que el límite de la lista de espera use la IP real (15 R7).
  # caddy:
  #   image: caddy:2.8-alpine
  #   command: caddy reverse-proxy --from api.trustservices.com.co --to api:8000
  #   depends_on:
  #     - api
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - caddy_data:/data
  #   restart: unless-stopped

volumes:
  trust_pg: {}
  # caddy_data: {}
