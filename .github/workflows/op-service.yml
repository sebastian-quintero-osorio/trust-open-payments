name: op-service DevSecOps
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: op-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-security:
    name: op-service / quality-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: op_service_test
          POSTGRES_USER: op_service
          POSTGRES_PASSWORD: ephemeral-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U op_service -d op_service_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://op_service:ephemeral-ci-password@localhost:5432/op_service_test?sslmode=disable
    defaults:
      run:
        working-directory: open-payments
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: open-payments/go.mod
          cache-dependency-path: open-payments/go.sum
      - name: Install pinned analyzers
        run: ./scripts/install-tools.sh
      - name: Install OpenAPI validator
        run: |
          python3 -m venv "$RUNNER_TEMP/op-service-validation"
          "$RUNNER_TEMP/op-service-validation/bin/pip" install -r scripts/requirements-tools.txt
          printf '%s\n' "$RUNNER_TEMP/op-service-validation/bin" >> "$GITHUB_PATH"
      - name: Validate contract, integration, concurrency, and security
        run: ./scripts/check.sh

      - name: Build non-root image
        run: docker build -t trust-op-service:ci .
      - name: Validate deployment manifests
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.demo.yaml config --quiet
          docker run --rm -e PAY_DOMAIN=pay.example -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/Caddy.demo:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
